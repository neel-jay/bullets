<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 280px; margin: 0; padding: 16px; font-family: -apple-system, sans-serif; }
  h3 { margin: 0 0 6px; font-size: 14px; display:flex; align-items:center; gap:8px; }
  h3 span { width:24px; height:24px; background:#0f0f0f; color:#fff; display:grid; place-items:center; border-radius:6px; font-size:12px; }
  p { font-size: 12px; color:#606060; line-height:1.5; margin: 0 0 12px; }
  .row { display:flex; gap:8px; }
  button { flex:1; padding: 9px; border-radius: 20px; border:none; font-weight:600; font-size:12px; cursor:pointer; }
  #openOptions { background:#0f0f0f; color:#fff; }
  #summarize { background:#e8f0fe; color:#1a73e8; }
  .hint { margin-top:10px; font-size:11px; color:#888; background:#f8f9fa; padding:8px; border-radius:8px; }
  #keyStatus { font-size:11px; margin-bottom:8px; padding:6px 8px; border-radius:6px; display:none; }
  #keyStatus.ok { display:block; background:#e6f4ea; color:#137333; }
  #keyStatus.warn { display:block; background:#fce8e6; color:#a50e0e; }
</style>
</head>
<body>
  <h3><span>✦</span> YouTube Summarizer</h3>
  <div id="keyStatus"></div>
  <p>Right-click any <b>thumbnail/link</b> on YouTube → <b>Summarize video</b>. No need to open. AI picks best format from title & duration.</p>
  <div class="row">
    <button id="openOptions">Options</button>
    <button id="summarize">Summarize this video</button>
  </div>
  <div class="hint">Needs captions & DeepSeek key. Style: Options → Auto (bullets / steps / ASCII).</div>
<script src="popup.js"></script>
</body>
</html>
